<!DOCTYPE html>
<html>
<head><title>Triggering Flow</title></head>
<body>
  <h3>Sending request...</h3>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email");

    fetch("YOUR_FLOW_URL_HERE", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        click: "true",
        email: email
      })
    })
    .then(() => {
      document.body.innerHTML = "<h2>✅ Thank you! Your click has been recorded.</h2>";
    })
    .catch(() => {
      document.body.innerHTML = "<h2>❌ Something went wrong.</h2>";
    });
  </script>
</body>
</html>
